modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/longqiuting/lted/issues"

[[mods]]
modId = "mtrlte"
version = "${version}"
displayName = "LTED"
authors = "厦航在拍车的无名机长 (kigurumiLTY)"
description = '''
LTED 是 MTR 的装饰拓展（Forge 侧）。
'''

[[dependencies.mtrlte]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrlte]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

# 运行期由已安装的 MTR Forge 版提供；编译期只用了 mtr.Items.BRUSH，
# 所以这里不强制依赖，缺 MTR 也不会让模组加载失败。
[[dependencies.mtrlte]]
modId = "mtr"
mandatory = false
versionRange = "[3.6,)"
ordering = "AFTER"
side = "BOTH"
